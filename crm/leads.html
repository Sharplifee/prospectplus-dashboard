<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="pp.css"><script src="pp.js"></script><title>Seller leads — Premier Prospect</title></head><body><script>
PP.shell('Seller leads','Homeowners ranked by how strongly independent county filings converge. Click any row for the evidence and to record an outcome.');
const q=new URLSearchParams(location.search);
const F={docs:+(q.get('docs')||1),conv:+(q.get('conv')||0),auction:q.get('auction')==='1',equity:q.get('equity')==='1',county:q.get('county')||'',search:''};
async function load(){
  const b=document.getElementById('body');
  b.innerHTML=`<div class="controls">
    <input id="s" placeholder="Search owner…" value="${PP.esc(F.search)}" style="min-width:220px">
    <select id="docs"><option value="1">Any documents</option><option value="2">2+ documents</option><option value="3">3+ documents</option></select>
    <select id="conv"><option value="0">Any conviction</option><option value="60">60+</option><option value="75">75+</option><option value="85">85+</option><option value="95">95+</option></select>
    <select id="scope"><option value="mine">My territory</option><option value="all">Everything</option></select>
    <select id="county"><option value="">All counties</option></select>
    <label class="btn"><input type="checkbox" id="auction" style="width:auto"> Auction scheduled</label>
    <label class="btn"><input type="checkbox" id="equity" style="width:auto"> Likely high equity</label>
    <button class="btn pri" onclick="apply()">Apply</button>
    <button class="btn" onclick="Object.assign(F,{docs:1,conv:0,auction:false,equity:false,county:'',search:'',scope:'mine'});load()">Reset</button>
    <button class="btn" onclick="exportCSV()" title="Download the current filtered list">⬇ Export CSV</button>
    <button class="btn" onclick="mailExport()" title="Owners with a verified tax-notice mailing address, ready for a letter batch">✉ Mail list</button>
    <button class="btn" onclick="letterBatch()" title="One ready-to-print letter per owner, worded for their situation">📄 Letters</button>
    <span class="muted" id="cnt"></span></div><div id="rows" class="muted">Loading…</div>`;
  document.getElementById('docs').value=F.docs;document.getElementById('conv').value=F.conv;document.getElementById('scope').value=F.scope||'mine';
  document.getElementById('auction').checked=F.auction;document.getElementById('equity').checked=F.equity;
  document.getElementById('s').onkeydown=e=>{if(e.key==='Enter')apply()};
  try{
    const cs=await PP.rpc('pp_app_county_breakdown'); const sel=document.getElementById('county');
    cs.forEach(c=>{const o=document.createElement('option');o.value=c.county;o.textContent=c.county+' ('+c.n+')';sel.appendChild(o)}); sel.value=F.county;
    let p='pp_conviction_queue?select=*&order=conviction_score.desc,signal_count.desc';
    if(F.conv>0)p+='&conviction_score=gte.'+F.conv; if(F.docs>1)p+='&signal_count=gte.'+F.docs;
    if(F.auction)p+='&max_stage=eq.5'; if(F.equity)p+='&equity_proxy=gte.60';
    if(F.county)p+='&county=eq.'+encodeURIComponent(F.county); if(F.search)p+='&owner_display=ilike.*'+encodeURIComponent(F.search)+'*';
    let rows=[];
    if((F.scope||'mine')==='mine'){
      // territory-scoped: the same RPC the app uses; falls back to Everything when no territory is set
      const J=x=>typeof x==='string'?JSON.parse(x):x; const mine=J(await PP.rpc('pp_app_territory_leads',{p_limit:3000,p_worth_a_look:false}));
      const terr=await PP.get('pp_agent_territories?select=county&limit=1').catch(()=>[]);
      if(!terr.length && !mine.length){ F.scope='all'; document.getElementById('scope').value='all'; }
      else { rows=mine.filter(x=>(F.conv<=0||x.conviction_score>=F.conv)&&(F.docs<=1||x.signal_count>=F.docs)&&(!F.auction||x.max_stage===5)&&(!F.equity||(x.equity_proxy||0)>=60)&&(!F.county||x.county===F.county)&&(!F.search||(x.owner_display||'').toLowerCase().includes(F.search.toLowerCase()))); }
    }
    if((F.scope||'mine')==='all'){
      // PostgREST caps a request at 1,000 rows — page through the whole queue
      // first page renders immediately; remaining pages are fetched in parallel and appended, never re-rendered
      const first=await PP.get(p+'&limit=1000&offset=0'); rows=first.slice(); window._rows=rows; render(rows, first.length===1000);
      if(first.length===1000){
        // sequential on purpose: parallel hits on the queue view trip the DB statement timeout and drop pages
        const tb=document.querySelector('#rows tbody');
        for(let off=1000;;off+=1000){
          const pg=await PP.get(p+'&limit=1000&offset='+off); if(!pg.length) break;
          const start=rows.length; rows=rows.concat(pg); window._rows=rows; if(tb) tb.insertAdjacentHTML('beforeend', rowsHtml(pg,start));
          document.getElementById('cnt').textContent=rows.length+' leads'+(pg.length===1000?' — loading more…':'');
          if(pg.length<1000) break;
        }
        document.getElementById('cnt').textContent=rows.length+' leads';
      }
      return;
    }
    window._rows=rows; render(rows,false);
  }catch(e){ document.getElementById('rows').innerHTML=PP.err('Query failed: '+e.message); }
}
function rowsHtml(rows,start){ return rows.map((x,k)=>{ const i=start+k; return `<tr class="row" onclick="PP.openLead(window._rows[${i}])"><td><span class="score ${PP.cls(x.conviction_score)}">${x.conviction_score}</span><div class="muted" style="font-size:10px">${PP.tier(x.conviction_score)}</div></td>
        <td><b>${PP.esc(x.owner_display||'—')}</b><div class="muted" style="font-size:11px">${PP.esc(x.city||x.county||'')} · ${PP.esc((x.property_ref||'').slice(0,40))}${x.assigned_agent?' · → '+PP.esc(x.assigned_agent)+(x.split_pct&&x.split_pct<100?' '+x.split_pct+'%':''):''}</div></td>
        <td><span class="${x.max_stage>=4?'s-hot':'muted'}" style="font-size:12px">${PP.stage(x.max_stage)}</span></td>
        <td class="why">${PP.esc(x.why||'')}</td><td>${x.signal_count??'—'}</td><td>${PP.pill(x.lifecycle_state)}</td></tr>`; }).join(''); }
function render(rows, more){
      document.getElementById('cnt').textContent=rows.length+' leads'+(more?' — loading more…':'');
      const r=document.getElementById('rows');
      if(!rows.length){ r.innerHTML=PP.empty('▤', (F.scope||'mine')==='mine'?'Nothing in your territory matches':'No leads match these filters', (F.scope||'mine')==='mine'?'Add cities on My territory, lower your threshold, or switch the scope to Everything.':'Try widening the document or conviction threshold.'); return; }
      r.innerHTML=`<table class="tbl"><thead><tr><th style="width:60px">Score</th><th>Owner</th><th>Stage</th><th>Why this lead</th><th>Docs</th><th>Status</th></tr></thead><tbody>${
        rowsHtml(rows,0)}</tbody></table>`;
}
function apply(){F.scope=document.getElementById('scope').value;F.search=document.getElementById('s').value;F.docs=+document.getElementById('docs').value;F.conv=+document.getElementById('conv').value;
  F.county=document.getElementById('county').value;F.auction=document.getElementById('auction').checked;F.equity=document.getElementById('equity').checked;load();}
// iPhone Safari ignores the download attribute on blob URLs, so on mobile use the
// share sheet (Files / Mail / AirDrop); on desktop, a normal download.
async function saveFile(text,name,type){
  const file=new File([text],name,{type});
  if(navigator.canShare && navigator.canShare({files:[file]})){ try{ await navigator.share({files:[file],title:name}); return; }catch(e){ if(e.name==='AbortError') return; } }
  const a=document.createElement('a'); a.href=URL.createObjectURL(file); a.download=name; a.target='_blank'; document.body.appendChild(a); a.click(); a.remove();
}
function exportCSV(){
  const rows=window._rows||[]; if(!rows.length){alert('Nothing to export — apply filters that return leads first.');return;}
  const cols=[['owner','owner_display'],['conviction',r=>r.conviction_score],['tier',r=>PP.tier(r.conviction_score)],['stage',r=>PP.stage(r.max_stage)],
    ['county','county'],['property_ref','property_ref'],['county_entries','county_entries'],['documents','signal_count'],['signal_types',r=>(r.signal_types||[]).join('|')],
    ['equity_proxy_pct',r=>r.equity_proxy==null?'':Math.round(r.equity_proxy)],['oldest_loan_years',r=>r.oldest_loan_years==null?'':Math.round(r.oldest_loan_years)],
    ['tax_owed',r=>r.total_tax_debt==null?'':Math.round(r.total_tax_debt)],['why','why'],['status','lifecycle_state'],['entity_key','entity_key']];
  const q=v=>{v=(v??'').toString();return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const csv=[cols.map(c=>c[0]).join(',')].concat(rows.map(r=>cols.map(c=>q(typeof c[1]==='function'?c[1](r):r[c[1]])).join(','))).join('\n');
  const tag=[F.docs>1?F.docs+'plus-docs':'',F.conv>0?'conv'+F.conv:'',F.auction?'auction':'',F.equity?'equity':'',F.county||''].filter(Boolean).join('_')||'all';
  saveFile(csv,'premier-prospect-leads_'+tag+'_'+new Date().toISOString().slice(0,10)+'.csv','text/csv');
}
async function mailExport(){
  const absOnly=confirm('Absentee owners only?\n\nOK = only owners whose mail goes somewhere other than the property (the classic direct-mail audience).\nCancel = every owner with a verified mailing address.');
  let rows;
  try{ rows=await PP.rpc('pp_app_mail_export',{p_min_conviction:F.conv||60,p_absentee_only:absOnly}); }catch(e){ alert('Export failed: '+e.message); return; }
  if(!rows.length){ alert('No owners with a verified mailing address match. The nightly enrichment adds more each morning.'); return; }
  const cols=['owner','mail_street','mail_city','mail_state','mail_zip','mailing_address','property_address','situation','conviction','assessed_value','real_equity_pct','absentee_verified','documents','county','entity_key'];
  const q=v=>{v=(v??'').toString();return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const csv=[cols.join(',')].concat(rows.map(r=>cols.map(c=>q(r[c])).join(','))).join('\n');
  saveFile(csv,'premier-prospect-mail_'+(absOnly?'absentee':'all')+'_conv'+(F.conv||60)+'_'+new Date().toISOString().slice(0,10)+'.csv','text/csv');
}
// Situation-specific letters. Every letter cites the actual public filing so
// the reader can verify it — the same principle as the call opener. No claims
// beyond the record. Sender details are placeholders to fill once.
const SENDER={name:'[Your name]',brokerage:'[Brokerage]',phone:'[Phone]',email:'[Email]'};
function letterFor(r){
  const first=(r.owner||'').split(',')[1]?.trim().split(' ')[0]||'';
  const greet=first?`Dear ${first.charAt(0)+first.slice(1).toLowerCase()},`:'Hello,';
  const prop=r.property_address||'your property';
  const eq=r.real_equity_pct!=null?` Based on the county's assessed value, you may have meaningful equity in it — which changes what your options are.`:'';
  const body={
    'Auction scheduled':`I'm writing because a notice of trustee sale has been recorded against ${prop}. That means a sale date has been set, and once it passes, the decision is out of your hands.\n\nI help homeowners in exactly this position understand what they can still do before that date — including selling on their own terms, which usually leaves them in a far better spot than the auction does.${eq}\n\nThere's no obligation. If you'd like to know what your options actually look like, call me.`,
    'Foreclosure filed':`I'm writing because a notice of default has been recorded against ${prop}. There is still time to take control of how this ends.\n\nI work with homeowners at this stage. Sometimes the answer is to sell before the process goes further; sometimes it isn't. Either way, knowing your options early is worth a great deal.${eq}\n\nIf you'd like a straight conversation about where things stand, call me.`,
    'Lender preparing':`I'm writing because your lender recently substituted the trustee on your loan for ${prop}. That step usually comes shortly before a foreclosure filing.\n\nI'd rather talk with you now, while you have the most options, than after a notice is recorded.${eq}\n\nIf that's a conversation you'd like to have, call me.`,
    'Creditor action':`I'm writing because a lien has been recorded against ${prop}. Sometimes a sale clears everything cleanly and leaves money in your pocket; sometimes there are better routes.${eq}\n\nI can walk you through what a sale would actually look like, with no obligation. Call me if that's useful.`,
    'Financial pressure':`I work with homeowners in ${r.county||'this'} County who are dealing with property-tax pressure. I'm not a collector and I'm not here to pressure you — I help people decide whether selling makes sense, and what it would mean for them.${eq}\n\nIf you'd like to talk it through, call me.`,
  }[r.situation]||`I noticed recent activity on ${prop} at the county recorder and wanted to reach out before anyone else does.${eq}\n\nIf it's useful to talk through your options, call me.`;
  const absentee=r.absentee_verified?`\n\nI'm sending this to your mailing address rather than the property, since it looks like you may not live there.`:'';
  return `${SENDER.name}\n${SENDER.brokerage}\n${SENDER.phone} · ${SENDER.email}\n\n${new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'})}\n\n${r.owner}\n${r.mail_street||''}\n${[r.mail_city,r.mail_state,r.mail_zip].filter(Boolean).join(' ')}\n\n${greet}\n\n${body}${absentee}\n\nSincerely,\n${SENDER.name}\n${SENDER.phone}`;
}
async function letterBatch(){
  const absOnly=confirm('Absentee owners only?\n\nOK = only owners whose mail goes somewhere other than the property.\nCancel = every owner with a verified mailing address.');
  let rows; try{ rows=await PP.rpc('pp_app_mail_export',{p_min_conviction:F.conv||60,p_absentee_only:absOnly}); }catch(e){ alert('Failed: '+e.message); return; }
  if(!rows.length){ alert('No owners with a verified mailing address match.'); return; }
  const text=rows.map(letterFor).join('\n\n\n' + '='.repeat(60) + '\n\n\n');
  // every owner in the batch gets a mail_sent touch so Work and Pipeline see it
  PP.rpc('pp_log_mail_batch',{p_entity_keys:rows.map(r=>r.entity_key)}).catch(()=>{});
  saveFile(text,'premier-prospect-letters_'+(absOnly?'absentee':'all')+'_'+new Date().toISOString().slice(0,10)+'.txt','text/plain');
}
window.PP_reload=load; load();
</script></body></html>
