<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in — Premier Prospect</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="pp.css"><script src="pp.js"></script>
<style>body{display:flex;align-items:center;justify-content:center;background:var(--bg)}
.box{width:380px;max-width:92vw;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:34px}
.box .nm{font-size:22px;font-weight:300;letter-spacing:-.02em}.box .nm sup{font-size:9px;color:var(--gold);vertical-align:super}
.box .sub{font-size:10.5px;color:var(--dim);letter-spacing:.14em;text-transform:uppercase;margin:3px 0 26px}
.box label{display:block;font-size:12px;color:var(--dim);margin:12px 0 5px}.box input{width:100%}
.box .btn{width:100%;justify-content:center;margin-top:18px;padding:11px}
.box .e{color:#f3b1a4;font-size:12.5px;margin-top:10px;min-height:16px}</style></head>
<body><div class="box">
  <div class="nm">Premier Prospect<sup>™</sup></div><div class="sub">A Williams &amp; Co. System</div>
  <label>Email</label><input id="e" type="email" autocomplete="username">
  <label>Password</label><input id="p" type="password" autocomplete="current-password">
  <button class="btn pri" id="go" onclick="go()">Sign in</button>
  <div class="e" id="err"></div>
  <div style="display:flex;justify-content:space-between;margin-top:12px;font-size:12px"><span class="muted">Invite-only — ask your admin for a link</span><a href="#" onclick="forgot();return false" class="muted">Forgot password</a></div>
  <p class="muted" style="margin-top:18px;font-size:11.5px">The first account on a new system becomes its admin. This system contains public-record information about homeowners; treat it accordingly.</p>
</div>
<script>
if(PP.sess()) location.href='index.html';
async function go(){ const b=document.getElementById('go'); b.disabled=true; document.getElementById('err').textContent='';
  try{ await PP.signIn(document.getElementById('e').value.trim(), document.getElementById('p').value); location.href='index.html'; }
  catch(x){ document.getElementById('err').textContent=x.message; b.disabled=false; } }
document.getElementById('p').onkeydown=e=>{ if(e.key==='Enter') go(); };
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxidmFvc3lmaWtrcHZjd2tzaXBoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUwMDg0MDksImV4cCI6MjA5MDU4NDQwOX0.Gh9whjmUPz4rdKYr5yo8ZHS0nSNpkQUOwdIladX6mG4', URL='https://lbvaosyfikkpvcwksiph.supabase.co';
const msg=t=>{ const e=document.getElementById('err'); e.textContent=t; e.style.color=t.startsWith('Check')?'#9ad7b3':''; };
async function forgot(){ const em=document.getElementById('e').value.trim(); if(!em) return msg('Enter your email first, then tap Forgot password.');
  const r=await fetch(URL+'/auth/v1/recover',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:em,options:{redirectTo:location.origin+location.pathname.replace('login.html','reset.html')}})});
  msg(r.ok?'Check your email for a reset link.':'Could not send a reset email.'); }
(function(){ const h=new URLSearchParams(location.hash.slice(1)); const t=h.get('access_token'); if(!t) return;
  localStorage.setItem('pp.session',JSON.stringify({access_token:t,refresh_token:h.get('refresh_token')||'',expires_at:Date.now()+(+h.get('expires_in')||3600)*1000}));
  location.href = (h.get('type')==='recovery' || h.get('type')==='invite') ? 'reset.html' : 'index.html'; })();
</script></body></html>
