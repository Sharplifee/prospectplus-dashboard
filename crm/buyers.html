<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f1f3d"><link rel="stylesheet" href="pp.css"><script src="pp.js"></script><title>Buyers — Premier Prospect</title></head><body><script>
PP.shell('Buyers','People still in the market: investors on a 1031 clock, divorcing homeowners, landlords, repeat buyers and investors. One-time homebuyers who already bought are left out. Every one rests on a recorded deed or a court case.','<button class="btn pri" onclick="addBuyer()">+ Add a buyer</button>');
let S='', F=(new URLSearchParams(location.search).get('f'))||'all';
const fmtD=d=>d?new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',timeZone:'America/Denver'}):'';
const has=(x,t)=>(x.signal_types||[]).includes(t);
const PLBL={exchange_window:'1031 investors',divorce:'Divorcing homeowners',off_title:'Taken off a title',flip:'Flippers',landlord:'Landlords'};
const money=v=>v==null?'—':'$'+Math.round(v).toLocaleString();
const LBL={purchase:'Recorded purchase',financing:'Financed purchase',private_financing:'Privately financed',cash_purchase:'Cash purchase',move_up:'Sold, no purchase since',parcel_value:'Assessed value of property bought',exchange_window:'Investor sale, 1031 clock running',divorce:'Divorce case, home on title',landlord:'Eviction filed as landlord',off_title:'Taken off a home title',flip:'Bought and resold'};
function filterQ(){ return F==='investors'?'&or=(is_entity.eq.true,purchases.gte.2,private_financed.gt.0)&is_move_up=eq.false':F==='cash'?'&cash_purchases=gt.0':F==='exchange'?'&signal_types=cs.%7Bexchange_window%7D':F==='divorce'?'&signal_types=cs.%7Bdivorce%7D':F==='landlord'?'&signal_types=cs.%7Blandlord%7D':F==='flip'?'&signal_types=cs.%7Bflip%7D':F==='offtitle'?'&signal_types=cs.%7Boff_title%7D':''; }
function orderQ(){ return F==='exchange'||F==='divorce'?'order=deadline_at.asc.nullslast,buyer_score.desc':'order=buyer_score.desc,purchases.desc'; }
function lastCol(x){ if(x.deadline_at&&new Date(x.deadline_at)>new Date()) return '<b>'+PP.esc(x.deadline_label||'Due')+' '+fmtD(x.deadline_at)+'</b>'; const d=x.days_since_last; if(d==null) return '—';
  return (has(x,'flip')?'Resold ':has(x,'off_title')?'Off title ':x.is_move_up||has(x,'exchange_window')?'Sold ':x.purchases>0?'Last bought ':has(x,'landlord')?'Eviction filed ':'Filed ')+d+'d ago'; }
function tags(x){ const t=[]; if(x.is_move_up) t.push('<span class="pill p-live">just sold</span>'); else if(x.purchases>0) t.push(`<span class="pill">${x.purchases} purchase${x.purchases===1?'':'s'}</span>`);
  if(has(x,'exchange_window')) t.push('<span class="pill p-hot">1031 window</span>'); if(has(x,'divorce')) t.push('<span class="pill p-hot">divorce</span>'); if(has(x,'landlord')) t.push('<span class="pill">landlord</span>'); if(has(x,'flip')) t.push('<span class="pill p-hot">flipper</span>'); if(has(x,'off_title')) t.push('<span class="pill p-hot">off title</span>');
  if(x.cash_purchases>0) t.push('<span class="pill p-won">cash</span>'); if(x.private_financed>0) t.push('<span class="pill p-hot">private $</span>');
  if(x.value_low!=null) t.push(`<span class="pill">${money(x.value_low)}${x.value_high>x.value_low?'–'+money(x.value_high):''}</span>`); if(x.distinct_counties>1) t.push('<span class="pill p-live">multi-county</span>'); return t.join(' '); }
async function load(){
  const b=document.getElementById('body'); b.innerHTML=PP.loading();
  try{
    const [bo,rows,mine]=await Promise.all([PP.rpc('pp_app_buyer_overview'),
      F==='mine'?[]:PP.get('pp_buyer_intel?select=*&'+orderQ()+'&limit=300'+filterQ()+(S?'&buyer_display=ilike.*'+encodeURIComponent(S)+'*':'')),
      PP.rpc('pp_app_my_buyer_leads')]);
    const o=typeof bo==='string'?JSON.parse(bo):bo; const my=typeof mine==='string'?JSON.parse(mine):(mine||[]); window._my=my; window._rows=rows;
    const seg=[['all','All'],['exchange','1031 window'],['divorce','Divorce'],['investors','Investors'],['landlord','Landlords'],['flip','Flippers'],['offtitle','Off title'],['cash','Cash'],['mine','Mine ('+my.length+')']].map(([k,l])=>`<button class="btn sm ${F===k?'pri':''}" onclick="F='${k}';load()">${l}</button>`).join(' ');
    b.innerHTML=`<div class="kpis">
      <div class="kpi"><div class="l">Buyers in the market</div><div class="v">${o.total}</div><div class="h">${o.by_county?Object.entries(o.by_county).map(([c,n])=>c+' '+n).join(' · '):'all counties'}</div></div>
      <div class="kpi" style="cursor:pointer" onclick="F='exchange';load()"><div class="l">1031 window</div><div class="v hot">${o.exchange_window??'—'}</div><div class="h">${o.exchange_due_45??0} must name a property within 45 days</div></div>
      <div class="kpi" style="cursor:pointer" onclick="F='divorce';load()"><div class="l">Divorcing homeowners</div><div class="v hot">${o.divorce??'—'}</div><div class="h">both spouses, home on title</div></div>
      <div class="kpi" style="cursor:pointer" onclick="F='landlord';load()"><div class="l">Landlords</div><div class="v">${o.landlord??'—'}</div><div class="h">own rentals, filed an eviction</div></div>
      <div class="kpi" style="cursor:pointer" onclick="F='offtitle';load()"><div class="l">Taken off a title</div><div class="v hot">${o.off_title??'—'}</div><div class="h">moved out, needs a place</div></div>
      <div class="kpi" style="cursor:pointer" onclick="F='flip';load()"><div class="l">Flippers</div><div class="v hot">${o.flip??'—'}</div><div class="h">bought and resold within a year</div></div>
      <div class="kpi"><div class="l">Repeat buyers</div><div class="v hot">${o.repeat}</div><div class="h">2+ purchases</div></div></div>
      <div class="controls">${seg}<input id="s" placeholder="Search buyer…" value="${PP.esc(S)}" style="min-width:220px"><button class="btn" onclick="S=document.getElementById('s').value;load()">Search</button><span class="muted">${F==='mine'?my.length:rows.length} shown</span></div>
      ${F==='mine' ? (my.length?`<table class="tbl"><thead><tr><th>Status</th><th>Buyer</th><th>Contact</th><th>Looking for</th><th>Financing</th><th>Source</th><th></th></tr></thead><tbody>${my.map((l,i)=>`<tr><td><span class="pill p-live">${PP.esc((l.status||'new').replace('_',' '))}</span></td><td><b>${PP.esc(l.name)}</b>${l.notes?`<div class="muted" style="font-size:12px">${PP.esc(l.notes)}</div>`:''}</td><td class="mono">${PP.esc(l.phone||'')}${l.phone&&l.email?'<br>':''}${PP.esc(l.email||'')}</td><td class="muted">${PP.esc(l.county||'')}${(l.cities||[]).length?' · '+PP.esc(l.cities.join(', ')):''}${l.price_low!=null?' · '+money(l.price_low)+'–'+money(l.price_high):''}${l.beds_min?' · '+l.beds_min+'+ bd':''}</td><td>${PP.esc((l.financing||'unknown').replace('_',' '))}</td><td class="muted">${PP.esc((l.source||'').replace('_',' '))}</td><td><button class="btn sm" onclick="editMine(${i})">Update</button></td></tr>`).join('')}</tbody></table>`
        : PP.empty('◈','Nobody captured yet','Open house, sign call, referral, sphere — add the buyers you actually talk to and they get matched to sellers automatically.'))
      : (rows.length?`<table class="tbl stack"><thead><tr><th>Score</th><th>Buyer</th><th>Why</th><th>Counties</th><th>Last</th><th>Verify</th></tr></thead><tbody>${
        rows.map((x,i)=>`<tr style="cursor:pointer" onclick="openBuyer(${i})"><td><span class="score s-warm">${x.buyer_score}</span></td><td><b>${PP.esc(x.buyer_display||'—')}</b><div class="muted" style="font-size:12px">${PP.esc(x.buyer_type||'')}</div><div style="margin-top:4px">${tags(x)}</div></td>
        <td class="muted" style="max-width:380px;font-size:12px;line-height:1.4">${PP.esc(x.why||'')}</td><td class="muted xs-hide">${(x.counties||[]).join(', ')}</td>
        <td class="muted">${lastCol(x)}</td><td class="mono xs-hide">${(x.entries||[]).slice(0,2).map(e=>'#'+e).join(', ')}</td></tr>`).join('')}</tbody></table>`
      : PP.empty('◈','No buyers match','Buyers come from recorded deeds and court cases. Try another filter or name.'))}
      ${(o.proof||[]).length?`<div class="sec">Proof so far</div><div class="card"><p class="muted" style="margin-bottom:8px">Every night we check each person we flagged against later recorded purchases. Only people flagged at least a month ago are counted, so a new flag isn't scored as a miss.</p>${o.proof.map(p=>`<div class="kv"><span><b>${PP.esc(PLBL[p.layer]||p.layer)}</b><div class="muted" style="font-size:11.5px">${p.followed_30d?`${p.bought} of ${p.followed_30d} flagged a month or more ago have since bought (${p.bought_pct??0}%)${p.median_days!=null&&p.bought?', after about '+p.median_days+' days':''}.`:'Too new to tell: everyone was flagged less than a month ago.'}${p.note?' '+PP.esc(p.note):''}</div></span><span class="mono">${p.flagged} flagged</span></div>`).join('')}</div>`:''}
      <div class="sec">How this side works</div>
      <div class="card"><p>Ten evidence layers, all from county documents and court calendars. Five are predictive and need no purchase on record: the <b>1031 window</b> (an investor, meaning an LLC, a repeat buyer or a hard-money borrower, sold in the last 180 days with no replacement purchase; if it is an exchange they must name a property by day 45 and close by day 180, and the list sorts by that deadline; developers selling more than three lots are left out), <b>divorcing homeowners</b> (a divorce case where a spouse owns a home, matched to the parcel; both spouses are listed because each needs a new place, with the next hearing date), <b>landlords</b> (filed an eviction as the plaintiff, so they own rentals; apartment complexes and managers are left out), <b>taken off a title</b> (a deed dropped one spouse and the other kept the house, so that person likely needs a place), and <b>flippers</b> (bought a property and resold the same one within a year, held at least two weeks; without a parcel number it only counts if they bought and sold two or more, because one of each is usually just a move; developers selling lots are left out). The rest describe how a buyer buys: the <b>recorded purchase</b> (warranty deed, grantee side), <b>financing</b> matched to that purchase within 14 days with lender and loan amount, <b>private or hard-money financing</b> (how investors buy), <b>cash</b> — claimed only where one county feed records deeds and trust deeds together, so absence proves something (Utah County's trust-deed feed is partial, so its buyers say "financing unknown"), the <b>assessed value</b> of what they bought, Salt Lake has no free recorder feed, so its buyers come from the court layers only. A deed into the owner's own trust, between family members, or on a timeshare or fractional unit is not a sale and is left out. Trust-deed grantees are excluded because that's the lender; quit-claims because they're family transfers. Every buyer is re-checked nightly at the recorder by the same integrity gate that guards sellers.</p></div>`;
    document.getElementById('s').onkeydown=e=>{if(e.key==='Enter'){S=e.target.value;load()}};
  }catch(e){ b.innerHTML=PP.err('Could not load buyers: '+e.message); }
}
async function openBuyer(i){
  const x=window._rows[i]; const dr=document.getElementById('drawer');
  dr.innerHTML=`<div class="hd"><div><h2>${PP.esc(x.buyer_display||'—')}</h2><div class="muted" style="margin-top:3px"><span class="score s-warm">${x.buyer_score}</span> · ${PP.esc(x.buyer_type||'')} · ${PP.esc(x.buyer_stage||'')}</div></div><button class="btn sm" onclick="PP.closeDrawer()" aria-label="Close">Close</button></div>
    <div class="bd"><div class="why-lead">${PP.esc(x.why||'')}</div><div style="margin:6px 0 12px">${tags(x)}</div>
    ${x.deadline_at&&new Date(x.deadline_at)>new Date()?`<div class="kv"><span>${PP.esc(x.deadline_label||'Deadline')}</span><span><b>${fmtD(x.deadline_at)}</b></span></div>`:''}
    <h4>Financing</h4>${has(x,'off_title')&&!x.purchases?'<div class="muted">Unknown. They may be due a share of the equity in the home they left.</div>':has(x,'flip')&&!x.purchases?'<div class="muted">Unknown. Flippers usually buy with cash or private money.</div>':has(x,'divorce')&&!x.purchases?'<div class="muted">Unknown. Equity from the marital home is the usual down payment.</div>':has(x,'landlord')&&!x.purchases?'<div class="muted">Unknown. Rental owners often buy with cash or a portfolio lender.</div>':(x.is_move_up||has(x,'exchange_window'))&&!x.purchases?'<div class="muted">Sold, not yet bought. Proceeds in hand.</div>':x.financing_known?`<div class="kv"><span>Financed</span><span>${x.financed_purchases||0}</span></div><div class="kv"><span>Cash</span><span>${x.cash_purchases||0}</span></div>${x.lender_class?`<div class="kv"><span>Lender type</span><span>${PP.esc(x.lender_class.replace('_',' '))}</span></div>`:''}${x.loan_low!=null?`<div class="kv"><span>Loan size</span><span>${money(x.loan_low)}${x.loan_high>x.loan_low?' – '+money(x.loan_high):''}</span></div>`:''}`:'<div class="muted">Unknown. Cash is only claimed where trust-deed coverage is complete.</div>'}
    ${x.value_low!=null?`<div class="kv"><span>${has(x,'divorce')?'Home on title (assessed)':'Bought at (assessed)'}</span><span>${money(x.value_low)}${x.value_high>x.value_low?' – '+money(x.value_high):''}</span></div>`:''}
    <h4>Evidence</h4><div id="ev" class="loading">Loading…</div>
    <h4>Houses that fit this buyer</h4><div id="sf" class="loading">Loading…</div>
    <div class="note">${has(x,'flip')?'An active flipper. Bring them distressed or below-market properties: they move fast and usually have cash or private money ready.':has(x,'off_title')?'They were taken off a home they co-owned, so they likely moved out recently. Lead with renting-to-owning or a starter home near where they were.':has(x,'exchange_window')?'If this sale is a 1031 exchange, they have to name a replacement by day 45 or pay the tax. Lead with a specific investment property that fits what they sold.':has(x,'divorce')?'Be gentle and specific. One spouse usually keeps or sells the house and the other needs a place soon. Offer to help either side.':has(x,'landlord')&&!x.purchases?'They own rentals. Ask whether they are adding to the portfolio or tired of it: either answer is a deal.':x.is_move_up?'They have the proceeds and no house on record yet. Call about where they are going, not where they were.':'Reach out with a specific property, not a pitch. A repeat buyer will take a call about a house that fits what they have already bought.'}</div></div>`;
  dr.classList.add('open'); document.getElementById('scrim').classList.add('open');
  try{ let ev=await PP.rpc('pp_app_buyer_evidence',{p_buyer_key:x.buyer_key}); ev=typeof ev==='string'?JSON.parse(ev):ev;
    document.getElementById('ev').className=''; document.getElementById('ev').innerHTML=ev.length?ev.map(e=>`<div class="kv"><span>${LBL[e.signal_type]||PP.esc(e.signal_type)}${e.lender?'<div class="muted" style="font-size:11px">'+PP.esc(e.lender)+'</div>':''}${e.property_address?'<div class="muted" style="font-size:11px">'+PP.esc(e.property_address)+'</div>':''}${e.detail&&e.detail.parties?'<div class="muted" style="font-size:11px">'+PP.esc(e.detail.parties)+(e.detail.courthouse?' · '+PP.esc(e.detail.courthouse):'')+'</div>':''}${e.detail&&e.detail.identify_by?'<div class="muted" style="font-size:11px">Name by '+PP.esc(e.detail.identify_by)+' · close by '+PP.esc(e.detail.close_by)+'</div>':''}</span><span class="mono">${e.entry?'#'+PP.esc(e.entry):''}${e.amount!=null?' · '+money(e.amount):''}${e.observed_at?' · '+e.observed_at.slice(0,10):''}</span></div>`).join(''):'<div class="muted">No evidence rows.</div>';
    let sf=await PP.rpc('pp_app_buyer_sellers',{p_buyer_key:x.buyer_key,p_limit:8}); sf=typeof sf==='string'?JSON.parse(sf):sf;
    document.getElementById('sf').className=''; document.getElementById('sf').innerHTML=sf.length?sf.map(s=>`<div class="kv" style="cursor:pointer" onclick="PP.openLeadByKey('${s.entity_key.replace(/'/g,"\\'")}')"><span><b>${PP.esc(s.owner_display||'—')}</b><div class="muted" style="font-size:11px">${PP.esc(s.match_reason||'')}</div></span><span>${s.fit_score!=null?'<b>'+s.fit_score+'</b> fit · ':''}${s.assessed_value!=null?money(s.assessed_value):''}</span></div>`).join(''):'<div class="muted">No confirmed seller in their counties right now.</div>';
  }catch(e){ document.getElementById('ev').textContent='Could not load: '+e.message; }
}
function addBuyer(){
  const dr=document.getElementById('drawer');
  dr.innerHTML=`<div class="hd"><div><h2>Add a buyer</h2><div class="muted" style="margin-top:3px">Someone you actually spoke with. Placeholder names are rejected.</div></div><button class="btn sm" onclick="PP.closeDrawer()" aria-label="Close">Close</button></div>
   <div class="bd" id="bf"><div class="kv"><span>Name</span><input id="f_name" placeholder="Full name"></div><div class="kv"><span>Phone</span><input id="f_phone"></div><div class="kv"><span>Email</span><input id="f_email"></div>
   <div class="kv"><span>County</span><select id="f_county"><option>Utah</option><option>Salt Lake</option><option>Wasatch</option><option>Summit</option></select></div>
   <div class="kv"><span>Cities</span><input id="f_cities" placeholder="comma separated"></div>
   <div class="kv"><span>Price</span><span><input id="f_lo" placeholder="low" style="width:45%"> <input id="f_hi" placeholder="high" style="width:45%"></span></div>
   <div class="kv"><span>Min beds / timeline</span><span><input id="f_beds" placeholder="beds" style="width:45%"> <input id="f_days" placeholder="days" style="width:45%"></span></div>
   <div class="kv"><span>Financing</span><select id="f_fin"><option value="unknown">Unknown</option><option value="cash">Cash</option><option value="preapproved">Pre-approved</option><option value="needs_lender">Needs a lender</option></select></div>
   <div class="kv"><span>Source</span><select id="f_src"><option value="open_house">Open house</option><option value="sign_call">Sign call</option><option value="referral">Referral</option><option value="sphere">Sphere</option><option value="web">Web</option><option value="other">Other</option></select></div>
   <div class="kv"><span>Notes</span><textarea id="f_notes" rows="3" style="width:100%"></textarea></div>
   <div id="f_err" class="err" style="display:none"></div><div style="margin-top:12px"><button class="btn pri" onclick="saveBuyer()">Save buyer</button></div></div>`;
  dr.classList.add('open'); document.getElementById('scrim').classList.add('open');
}
async function saveBuyer(){
  const g=id=>document.getElementById(id).value.trim(); const n=v=>{const x=parseFloat(String(v).replace(/[^0-9.]/g,'')); return isNaN(x)?null:x;};
  const cities=g('f_cities').split(',').map(s=>s.trim()).filter(Boolean);
  try{ await PP.rpc('pp_app_add_buyer_lead',{p_name:g('f_name'),p_phone:g('f_phone')||null,p_email:g('f_email')||null,p_county:g('f_county'),p_cities:cities.length?cities:null,p_price_low:n(g('f_lo')),p_price_high:n(g('f_hi')),p_beds_min:n(g('f_beds')),p_timeline_days:n(g('f_days')),p_financing:g('f_fin'),p_source:g('f_src'),p_notes:g('f_notes')||null});
    PP.closeDrawer(); F='mine'; load(); }
  catch(e){ const el=document.getElementById('f_err'); el.style.display='block'; el.textContent='Not saved: '+e.message; }
}
async function editMine(i){
  const l=window._my[i]; const st=prompt('Status for '+l.name+' (new, working, matched, under_contract, closed, dead):', l.status||'new'); if(st===null) return;
  const notes=prompt('Notes:', l.notes||''); if(notes===null) return;
  try{ await PP.rpc('pp_app_update_buyer_lead',{p_id:l.id,p_status:st.trim(),p_notes:notes}); load(); }catch(e){ alert('Not saved: '+e.message); }
}
window.PP_reload=load; load();
</script></body></html>
