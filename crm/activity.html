<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f1f3d"><link rel="stylesheet" href="pp.css"><script src="pp.js"></script><title>Activity — Premier Prospect</title><script src="../event-log.js" defer data-url="https://lbvaosyfikkpvcwksiph.supabase.co" data-key="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxidmFvc3lmaWtrcHZjd2tzaXBoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUwMDg0MDksImV4cCI6MjA5MDU4NDQwOX0.Gh9whjmUPz4rdKYr5yo8ZHS0nSNpkQUOwdIladX6mG4" data-project="prospectplus"></script>
</head><body><script>
PP.shell('Activity','Every call, note and outcome recorded against a lead, newest first. This is what the scoring learns from.','<button class="btn" onclick="load()">Refresh</button>');
async function load(){
  const b=document.getElementById('body'); b.innerHTML=PP.loading();
  try{
    const ev=await PP.rpc('pp_app_activity',{p_limit:150});
    if(!ev.length){ b.innerHTML=PP.empty('◷','No activity yet','Open a lead and record an outcome — it will appear here, and the system will learn from it.'); return; }
    const lbl={call:'Call',note:'Note',appointment_set:'Appointment set',appointment_held:'Appointment held',listing_signed:'Listing signed',sale_closed:'Sale closed',disqualified:'Disqualified',sms:'Text',email:'Email',mail_sent:'Letter mailed',already_listed:'Already listed',not_a_fit:'Not a fit',do_not_contact:'Do not contact'};
    b.innerHTML=`<table class="tbl"><thead><tr><th>When</th><th>Lead</th><th>Event</th><th>Outcome</th><th>Note</th><th>Now</th></tr></thead><tbody>${
      ev.map(e=>`<tr><td class="muted">${PP.ago(e.occurred_at)}</td><td><b>${PP.esc(e.owner_display||e.entity_key)}</b><div class="muted" style="font-size:11px">conviction ${e.conviction_at_event??'—'} at the time</div></td>
      <td>${lbl[e.event_type]||PP.esc(e.event_type)}</td><td class="muted">${PP.esc((e.outcome||'').replace(/_/g,' '))}</td><td class="muted" style="max-width:280px">${PP.esc(e.notes||'')}</td><td>${PP.pill(e.current_state)}</td></tr>`).join('')}</tbody></table>`;
  }catch(e){ b.innerHTML=PP.err('Could not load activity: '+e.message); }
}
window.PP_reload=load; load();
</script></body></html>
