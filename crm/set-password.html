<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Set your password · Premier Prospect</title><link rel="stylesheet" href="pp.css">
<style>body{display:grid;place-items:center;min-height:100vh;background:var(--bg)} .box{width:min(380px,92vw);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px} label{display:block;font-size:12px;color:var(--ink2);margin:10px 0 4px} input{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)} .btn{margin-top:14px;width:100%}</style></head>
<body><div class="box">
  <div style="font-size:11px;letter-spacing:.14em;color:var(--ink2)">PREMIER PROSPECT</div>
  <h2 style="margin:6px 0 2px">Set your password</h2>
  <div class="muted" id="who" style="font-size:12px">Reading your invite link…</div>
  <label>New password</label><input id="p1" type="password" autocomplete="new-password">
  <label>Confirm</label><input id="p2" type="password" autocomplete="new-password">
  <button class="btn" onclick="go()">Save and sign in</button>
  <div id="m" class="muted" style="font-size:12px;margin-top:10px"></div>
</div>
<script>
// Supabase sends invite and recovery links back with tokens in the URL hash.
const URLB='https://lbvaosyfikkpvcwksiph.supabase.co', KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxidmFvc3lmaWtrcHZjd2tzaXBoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUwMDg0MDksImV4cCI6MjA5MDU4NDQwOX0.Gh9whjmUPz4rdKYr5yo8ZHS0nSNpkQUOwdIladX6mG4';
const h=new URLSearchParams(location.hash.slice(1)); const tok=h.get('access_token'), rt=h.get('refresh_token'), typ=h.get('type');
const msg=t=>document.getElementById('m').textContent=t;
if(!tok){ document.getElementById('who').textContent='This link is missing its token. Ask your admin to resend the invite, or use Forgot password on the sign-in page.'; }
else { document.getElementById('who').textContent = typ==='recovery' ? 'Choose a new password for your account.' : 'You\'ve been invited. Choose a password to finish setting up.'; }
async function go(){
  const p1=document.getElementById('p1').value, p2=document.getElementById('p2').value;
  if(!tok) return; if(p1.length<8) return msg('Use at least 8 characters.'); if(p1!==p2) return msg('Passwords don\'t match.');
  const r=await fetch(URLB+'/auth/v1/user',{method:'PUT',headers:{apikey:KEY,Authorization:'Bearer '+tok,'Content-Type':'application/json'},body:JSON.stringify({password:p1})});
  if(!r.ok){ msg('Could not set password: '+((await r.json()).msg||r.status)); return; }
  const u=await r.json();
  localStorage.setItem('pp.session',JSON.stringify({access_token:tok,refresh_token:rt,email:u.email,expires_at:Date.now()+3600*1000}));
  msg('Saved. Taking you in…'); location.href='index.html';
}
</script></body></html>
